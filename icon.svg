<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#121212"/>
  
  <!-- Reference Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#333" stroke-width="4" stroke-dasharray="10,10"/>
  
  <!-- Rotor Needles (White) -->
  <g stroke="white" stroke-width="8" stroke-linecap="round">
    <!-- Aligned rotors -->
    <line x1="256" y1="416" x2="256" y2="456" transform="rotate(0, 256, 256)"/>
    <line x1="256" y1="416" x2="256" y2="456" transform="rotate(30, 256, 256)"/>
    <line x1="256" y1="416" x2="256" y2="456" transform="rotate(60, 256, 256)"/>
    <line x1="256" y1="416" x2="256" y2="456" transform="rotate(90, 256, 256)"/>
    <line x1="256" y1="416" x2="256" y2="456" transform="rotate(120, 256, 256)"/>
    <!-- Slightly deviated rotors (Dynamics) -->
    <line x1="256" y1="416" x2="240" y2="460" transform="rotate(150, 256, 256)"/>
    <line x1="256" y1="416" x2="230" y2="450" transform="rotate(180, 256, 256)"/>
    <line x1="256" y1="416" x2="256" y2="456" transform="rotate(210, 256, 256)"/>
    <!-- Aligned rotors -->
    <line x1="256" y1="416" x2="256" y2="456" transform="rotate(240, 256, 256)"/>
    <line x1="256" y1="416" x2="256" y2="456" transform="rotate(270, 256, 256)"/>
    <line x1="256" y1="416" x2="256" y2="456" transform="rotate(300, 256, 256)"/>
    <line x1="256" y1="416" x2="256" y2="456" transform="rotate(330, 256, 256)"/>
  </g>
  
  <!-- Central Mean Direction Arrow (Yellow) -->
  <g transform="translate(256, 256)">
    <line x1="0" y1="0" x2="0" y2="120" stroke="#FFD700" stroke-width="16" stroke-linecap="round"/>
    <path d="M -30 90 L 0 130 L 30 90" fill="none" stroke="#FFD700" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
