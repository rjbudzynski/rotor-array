[project]
name = "rotor-chain"
version = "1.0.0"
description = "Interactive Hamiltonian simulation of a square array of coupled planar rotors"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.2,<2.4",
    "pyqt6>=6.10.2",
    "pyqtgraph>=0.14.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-qt>=4.5.0",
    "scipy>=1.17.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.14.0",
]
perf = [
    "numba>=0.63.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "W",  # pycodestyle warnings
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
